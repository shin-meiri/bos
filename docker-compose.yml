version: '3.8'

services:
  # 1. DATABASE POSTGRESQL
  postgres-home:
    image: postgres:alpine
    container_name: posdb-v2
    restart: unless-stopped
    environment:
      POSTGRES_DB: maydb
      POSTGRES_USER: amy
      POSTGRES_PASSWORD: amy123
      PGDATA: "/var/lib/postgresql/data"
    volumes:
      - postgres_home_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - mydb_may-network
    deploy:
      resources:
        limits:
          memory: 100M

  # 2. LOCALHOST WEB SERVER (Kembali Dipasang untuk Atasi 502 Bad Gateway)
  web-localhost:
    image: nginx:alpine
    container_name: web-localhost
    restart: unless-stopped
    volumes:
      - /mnt/sdb/www:/usr/share/nginx/html:ro
    networks:
      - mydb_may-network
    command: sh -c "printf 'server {\n    listen 80;\n    listen [::]:80;\n    server_name localhost;\n\n    location / {\n        root /usr/share/nginx/html;\n        index index.html;\n        try_files $$uri $$uri/ /index.html;\n    }\n\n    location /api/ {\n        proxy_pass http://bos-api:5000;\n        proxy_set_header Host $$host;\n    }\n}\n' > /tmp/fresh_nginx.conf && mv -f /tmp/fresh_nginx.conf /etc/nginx/conf.d/default.conf && nginx -g 'daemon off;'"

  # 3. NODE.JS BACKEND + PROSES OTOMATIS BUILD FRONTEND
  bos-backend:
    image: node:alpine
    container_name: bos-api
    restart: unless-stopped
    working_dir: /app
    ports:
      - "5000:5000"
    environment:
      DB_USER: "amy"
      DB_HOST: "postgres-home"
      DB_NAME: "maydb"
      DB_PASSWORD: "amy123"
      DB_PORT: 5432
    networks:
      - mydb_may-network
    depends_on:
      - postgres-home
    volumes:
      - /mnt/sdb/www:/app/dist_host
    command: >
      sh -c "
      echo '=== 1. MENCARI LOKASI SOURCE CODE ASLI ===' &&
      TARGET_DIR=\$(find / -name package.json -not -path '*/node_modules/*' -quit | sed 's/package.json//') &&
      if [ -z \"\$TARGET_DIR\" ]; then
        echo 'ERROR: package.json tidak ditemukan!';
        exit 1;
      fi &&
      cd \"\$TARGET_DIR\" &&
      echo \"Berhasil masuk ke direktori proyek: \$(pwd)\" &&
      
      echo '=== 2. MENGINSTAL CORE DEPENDENCIES BACKEND ===' &&
      npm install express pg cors && 
      
      echo '=== 3. PROSES NPM RUN BUILD FRONTEND ===' &&
      npm install && 
      npm run build && 
      
      echo '=== 4. MEMINDAHKAN HASIL BUNDLE VITE KE /mnt/sdb/www ===' &&
      mkdir -p /app/dist_host &&
      rm -rf /app/dist_host/* &&
      cp -r dist/* /app/dist_host/ && 
      echo '=== BUILD SELESAI & OUTPUT SUDAH MASUK KE /mnt/sdb/www ===' &&
      
      echo '=== 5. MENJALANKAN BACKEND API ===' &&
      node -e \"
      const express = require('express');
      const { Pool } = require('pg');
      const cors = require('cors');
      const app = express();
      app.use(cors()); app.use(express.json());
      const pool = new Pool({ user: 'amy', host: 'postgres-home', database: 'maydb', password: 'amy123', port: 5432 });
      
      pool.query('CREATE TABLE IF NOT EXISTS users (id TEXT PRIMARY KEY, password TEXT)');
      
      app.post('/api/register', async (req, res) => {
        try {
          const { id, password } = req.body;
          await pool.query('INSERT INTO users (id, password) VALUES (\\\$1, \\\$2)', [id, password]);
          res.json({ success: true, message: 'Tersimpan di Postgres!' });
        } catch (err) { res.status(500).json({ error: err.message }); }
      });

      app.post('/api/login', async (req, res) => {
        const { id, password } = req.body;
        const result = await pool.query('SELECT * FROM users WHERE id = \\\$1 AND password = \\\$2', [id, password]);
        if (result.rows.length > 0) res.json({ success: true });
        else res.status(401).json({ success: false });
      });
      app.listen(5000, () => console.log('Backend Jalan di Port 5000'));
      \"
      "

networks:
  mydb_may-network:
    external: true

volumes:
  postgres_home_data:
    name: mydb_postgres_home_data
