version: '3.8'

services:
  frontend-builder:
    image: node:alpine
    container_name: bos-frontend-build-bot
    restart: "no"
    volumes:
      - /mnt/sdb/www:/mnt/sdb/www
    command: >
      sh -c "
      echo '=== 1. MENCARI LOKASI REPOSITORI ===' &&
      # Mencari folder yang berisi package.json di seluruh container
      TARGET_DIR=\$(find / -name package.json -not -path '*/node_modules/*' -quit | sed 's/package.json//') &&
      if [ -z \"\$TARGET_DIR\" ]; then
        echo 'ERROR: package.json tidak ditemukan sama sekali di dalam container!';
        exit 1;
      fi &&
      cd \"\$TARGET_DIR\" &&
      echo \"Berhasil masuk ke direktori kode: \$(pwd)\" &&
      
      echo '=== 2. MENGINSTAL DEPENDENCIES FRONTEND ===' &&
      npm install &&
      
      echo '=== 3. PROSES NPM RUN BUILD ===' &&
      npm run build &&
      
      echo '=== 4. MEMINDAHKAN HASIL BUILD KE /mnt/sdb/www ===' &&
      rm -rf /mnt/sdb/www/* &&
      if [ -d 'dist' ]; then
        cp -r dist/* /mnt/sdb/www/;
      elif [ -d 'build' ]; then
        cp -r build/* /mnt/sdb/www/;
      else
        echo 'ERROR: Folder hasil build (dist/build) tidak ditemukan!';
        exit 1;
      fi &&
      
      echo '=== SUCCESS: BUILD SELESAI & OUTPUT SUDAH MASUK KE /mnt/sdb/www ==='
      "
