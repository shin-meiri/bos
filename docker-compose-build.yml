version: '3.8'

services:
  frontend-builder:
    image: node:alpine
    container_name: bos-frontend-build-bot
    restart: "no"
    volumes:
      # Memetakan langsung folder hasil build ke host
      - /mnt/sdb/www:/mnt/sdb/www
    command: >
      sh -c "
      echo '=== 1. MEMERIKSA POSISI SOURCE CODE ===' &&
      pwd && ls -la &&
      
      echo '=== 2. MENGINSTAL DEPENDENCIES FRONTEND ===' &&
      npm install &&
      
      echo '=== 3. PROSES NPM RUN BUILD ===' &&
      npm run build &&
      
      echo '=== 4. MEMINDAHKAN HASIL BUILD KE /mnt/sdb/www ===' &&
      rm -rf /mnt/sdb/www/* &&
      cp -r dist/* /mnt/sdb/www/ || cp -r build/* /mnt/sdb/www/ &&
      
      echo '=== SUCCESS: BUILD SELESAI & OUTPUT SUDAH MASUK KE /mnt/sdb/www ==='
      "
