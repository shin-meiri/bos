version: '3.8'

services:
  frontend-builder:
    image: node:alpine
    container_name: bos-frontend-build-bot
    restart: "no"
    volumes:
      - /mnt/sdb/www:/mnt/sdb/www
    command: >
      sh -c "
      TARGET_SH=\$(find / -name build.sh -quit) &&
      if [ -n \"\$TARGET_SH\" ]; then
        chmod +x \"\$TARGET_SH\" && sh \"\$TARGET_SH\";
      else
        echo 'ERROR: File build.sh tidak ditemukan di Git!';
        exit 1;
      fi
      "
