version: "3.8"
services:
  web-vite:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: web-localhost
    restart: unless-stopped
    ports:
      - "80"  # Mengarahkan port 80 kontainer ke port 8080 server, atau gunakan "80:80"
    networks:
      - maynet

networks:
  maynet:
    external: true