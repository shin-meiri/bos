services:
  vite-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vite_nginx_container
    ports:
      - "80:80"
    volumes:
      # Memetakan folder html kontainer ke direktori host eksternal /mnt/sdb/www
      - /mnt/sdb/www:/usr/share/nginx/html
    restart: unless-stopped
