version: '3.8'

services:
  frontend-builder:
    # Melakukan build image lokal berdasarkan Dockerfile yang ada di Git
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bos-frontend-build-bot
    restart: "no"
    volumes:
      # Memetakan folder host server Anda
      - /mnt/sdb/www:/mnt/sdb/www
    command: >
      sh -c "
      echo '=== 1. MEMBERSIHKAN FOLDER HOST /mnt/sdb/www ===' &&
      rm -rf /mnt/sdb/www/* &&
      
      echo '=== 2. MEMINDAHKAN HASIL BUILD BARU ===' &&
      cp -r /app/html_output/* /mnt/sdb/www/ &&
      
      echo '=== SUCCESS: BUILD DOCKERFILE SELESAI & OUTPUT MASUK KE /mnt/sdb/www ==='
      "
