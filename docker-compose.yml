version: "3.8"

services:
  web-vite:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: web-localhost
    restart: unless-stopped
    ports:
      - "80" # Membiarkan Docker memberikan port internal dinamis yang bisa diakses NPM lewat maynet
    networks:
      - maynet

networks:
  maynet:
    external: true
